[tools]
go = "1.26"
golangci-lint = "2.12"
node = "22"
terraform = "1.12"
"go:github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs" = "latest"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.5.0"
"go:github.com/speakeasy-api/openapi-overlay" = "0.10.3"
"npm:@apiture/openapi-down-convert" = "0.14.1"
"npm:@commitlint/cli" = "21"

[tasks.build]
description = "Full CI pipeline"
depends = ["lint:commits", "download", "generate", "lint", "test", "tidy", "diff"]

[tasks."lint:commits"]
description = "lint commit messages (conventional commits)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${GITHUB_BASE_REF:-}" ]; then
  git fetch origin "$GITHUB_BASE_REF" 2>/dev/null || true
  commitlint --from "origin/$GITHUB_BASE_REF" --to HEAD
elif [ -n "$(git tag -l)" ]; then
  commitlint --from "$(git describe --tags --abbrev=0)" --to HEAD
else
  commitlint --last
fi
"""

[tasks.download]
description = "download Go dependencies"
run = "go mod download"

[tasks.generate]
description = "run all code generation (types, docs)"
run = "go generate ./..."

[tasks.lint]
description = "lint Go code"
run = "golangci-lint run --fix ./..."

[tasks.test]
description = "run unit tests"
run = "go test -count=1 -cover ./..."

[tasks.testacc]
description = "run acceptance tests against live SendGrid API"
run = "TF_ACC=1 go test -v -count=1 ./internal/..."

[tasks.tidy]
description = "tidy Go modules"
run = "go mod tidy -v"

[tasks.diff]
description = "check for git diffs"
run = """
if git rev-parse --is-inside-work-tree &>/dev/null; then
  git diff --exit-code
fi
"""

[tasks.docs]
description = "generate Terraform registry documentation"
run = "tfplugindocs generate"
